<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Inventário TI - Marcas, Modelos e Equipamentos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23818cf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='2' width='20' height='8' rx='2'/><rect x='2' y='14' width='20' height='8' rx='2'/><line x1='6' y1='6' x2='6.01' y2='6'/><line x1='6' y1='18' x2='6.01' y2='18'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Splash Screen (mostrado enquanto carrega) -->
  <div id="splash-screen" style="
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 60%, #312e81 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px; color: white; font-family: system-ui, sans-serif;
    transition: opacity 0.5s ease;
  ">
    <div style="width: 72px; height: 72px; border-radius: 16px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.15);">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="8" rx="2"/>
        <rect x="2" y="14" width="20" height="8" rx="2"/>
        <line x1="6" y1="6" x2="6.01" y2="6"/>
        <line x1="6" y1="18" x2="6.01" y2="18"/>
      </svg>
    </div>
    <div style="text-align: center;">
      <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.5px;">Gestor de Inventário TI</div>
      <div style="font-size: 14px; color: #94a3b8; margin-top: 6px;">Sistema de Gestão de Ativos</div>
    </div>
    <div style="width: 240px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; margin-top: 8px;">
      <div id="splash-bar" style="
        height: 100%; background: #818cf8; border-radius: 4px;
        width: 0%; transition: width 0.4s ease;
      "></div>
    </div>
    <div id="splash-msg" style="font-size: 12px; color: #64748b;">A inicializar...</div>
  </div>

  <!-- Raiz da aplicação principal -->
  <div id="app"></div>

  <!-- Modal Container -->
  <div id="modal-container" class="modal-overlay hidden">
    <div id="modal-content" class="modal-card"></div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Dados de contingência (seed embutido) -->
  <script src="seed-data.js"></script>
  <!-- Aplicação principal -->
  <script src="app.js"></script>

  <script>
    window.dismissSplashScreen = function() {
      const splash = document.getElementById('splash-screen');
      if (splash && splash.style.opacity !== '0') {
        const bar = document.getElementById('splash-bar');
        const msg = document.getElementById('splash-msg');
        if (bar) bar.style.width = '100%';
        if (msg) msg.textContent = 'Pronto';
        setTimeout(() => {
          splash.style.opacity = '0';
          splash.style.pointerEvents = 'none';
          setTimeout(() => { try { splash.remove(); } catch(e){} }, 300);
        }, 150);
      }
    };

    setTimeout(() => {
      const bar = document.getElementById('splash-bar');
      const msg = document.getElementById('splash-msg');
      if (bar) bar.style.width = '60%';
      if (msg) msg.textContent = 'A carregar base de dados...';
    }, 200);

    setTimeout(() => {
      window.dismissSplashScreen && window.dismissSplashScreen();
    }, 1200);
  </script>
</body>
</html>
